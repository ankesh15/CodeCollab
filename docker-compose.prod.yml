version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codecollab_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codecollab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecollab_prod_pass}
      POSTGRES_DB: ${POSTGRES_DB:-codecollab_db}
    ports:
      - "5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codecollab_user} -d ${POSTGRES_DB:-codecollab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: codecollab_prod_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-codecollab_user}:${POSTGRES_PASSWORD:-codecollab_prod_pass}@postgres:5432/${POSTGRES_DB:-codecollab_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_at_least_32_chars_long!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost}
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-https://judge0-ce.p.rapidapi.com}
      CODE_RUNNER_API_KEY: ${CODE_RUNNER_API_KEY:-dev_key}
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: codecollab_prod_web
    restart: always
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  prod_postgres_data:
    driver: local
